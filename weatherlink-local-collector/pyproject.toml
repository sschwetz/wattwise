[project]
name = "weatherlink-local-collector"
version = "0.1.0"
description = "Polls a Davis WeatherLink Live's local API and pushes readings into Core API (sub-project 4)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "respx>=0.21,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weatherlink_local_collector"]
