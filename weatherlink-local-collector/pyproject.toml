[project]
name = "weatherlink-local-collector"
version = "0.1.0"
description = "Polls a Davis WeatherLink Live's local API and pushes readings into Core API (sub-project 4)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8.0,<9.0",
    "respx>=0.21,<1.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weatherlink_local_collector"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long lines are left to the formatter's discretion; docstrings and URLs exceed 120.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["weatherlink_local_collector"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
