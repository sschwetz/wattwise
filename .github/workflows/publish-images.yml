name: Publish images

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - core-api
          - webapp
          - mail-relay
          - envoy-collector
          - weatherlink-local-collector
          - amber-pricing-collector
          - local-pricing-collector
          - actron-neo-actor
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io image names must be lowercase.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wattwise-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      # The About dialog reads webapp/public/licences.json. Regenerate it so the
      # image ships current data; the file is not committed back.
      - if: matrix.service == 'webapp'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - if: matrix.service == 'webapp'
        run: npm ci
        working-directory: webapp

      - if: matrix.service == 'webapp'
        uses: astral-sh/setup-uv@v6

      - if: matrix.service == 'webapp'
        run: python3 scripts/generate_licences.py

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
