server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Generated by docker-entrypoint.sh: the CSP needs the runtime API_BASE_URL.
    include /etc/nginx/security-headers.conf;

    # Polled by core-api for the About dialog. add_header in a location drops
    # the inherited headers, so the security headers are included again.
    location = /version {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
