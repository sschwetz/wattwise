[project]
name = "core-api"
version = "0.1.0"
description = "Core API: owns the database for the energy monitoring system (sub-project 1)."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "fastapi>=0.110,<1.0",
    "pyjwt>=2.8,<3.0",
    "bcrypt>=4.1,<5.0",
    "email-validator>=2.0,<3.0",
    "pyotp>=2.9,<3.0",
    "uvicorn>=0.30,<1.0",
    "apscheduler>=3.10,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "cryptography>=42,<47",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core_api"]
