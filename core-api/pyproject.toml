[project]
name = "core-api"
version = "0.1.0"
description = "Core API: owns the database for the energy monitoring system (sub-project 1)."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "fastapi>=0.110,<1.0",
    "pyjwt>=2.8,<3.0",
    "bcrypt>=4.1,<5.0",
    "email-validator>=2.0,<3.0",
    "pyotp>=2.9,<3.0",
    "uvicorn>=0.30,<1.0",
    "apscheduler>=3.10,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "cryptography>=42,<47",
    "websockets>=13,<16",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.17.2",
    "mypy>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core_api"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long lines are left to the formatter's discretion; docstrings and URLs exceed 120.
ignore = [
    "E501",
    # StrEnum changes str()/f-string output of the existing (str, Enum) classes.
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends/Query/Header/File are meant to be called in defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# sys.path / env setup must run before these imports.
"alembic/env.py" = ["E402"]
# Depends(require_source_kind(...)) builds a dependency per route by design.
"core_api/routers/*" = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["core_api"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
